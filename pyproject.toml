[project]
name = "finalproject-velichko"
version = "0.1.0"
description = "A command-line currency wallet simulator written in Python"
readme = "README.md"
authors = [
    { name = "vyvseya", email = "kopcopatytch@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
finalproject-velichko = "valutatrade_hub:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[tool.valutatrade]
data_dir = "data"
users_file = "users.json"
portfolios_file = "portfolios.json"
rates_file = "rates.json"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_file = "logs/actions.log"
log_format = "text"
log_level = "INFO"
