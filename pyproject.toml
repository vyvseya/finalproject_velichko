[project]
name = "finalproject-velichko"
version = "0.1.0"
description = "A command-line currency wallet simulator written in Python"
readme = "README.md"
authors = [
    { name = "vyvseya", email = "kopcopatytch@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
]

[project.scripts]
finalproject-velichko = "valutatrade_hub:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""